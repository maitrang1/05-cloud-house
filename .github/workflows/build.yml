name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# one run per branch: a newer push cancels the older one (saves free minutes)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # kill switch: set the repo variable CI_KILL to 1 and every run stops here
    if: ${{ vars.CI_KILL != '1' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      ZIG_VERS: "0.16.0"
    steps:
      - id: CODE-PULL
        uses: actions/checkout@v7

      - id: ZIGZ-CASH
        uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.os }}-${{ hashFiles('**/build.zig.zon') }}

      - id: ZIGZ-INST
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERS}/zig-x86_64-linux-${ZIG_VERS}.tar.xz" -o zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - id: EXEZ-BUIL
        run: |
          set -e
          found=0
          for f in $(git ls-files '*build.zig'); do
            found=1
            (cd "$(dirname "$f")" && zig build && zig build test)
          done
          echo "build files: $found"

      - id: PING-SEND
        if: ${{ always() }}
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
          JOBZ_STAT: ${{ job.status }}
        run: |
          if [ -z "$HEALTHCHECKS_URL" ]; then echo "no ping url set"; exit 0; fi
          if [ "$JOBZ_STAT" = "success" ]; then curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL" > /dev/null; else curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL/fail" > /dev/null; fi
  # a tag like v0.1.0 publishes a GitHub Release: one parallel job per app builds its files and attaches them; the release stays a hidden draft until every app is in
  rel-list:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.CI_KILL != '1' }}
    runs-on: @@RELRUNNER@@
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      apps: ${{ steps.APPS-LIST.outputs.apps }}
    steps:
      - id: CODE-PULL
        uses: actions/checkout@v7

      - id: APPS-LIST
        run: |
          apps=$(git ls-files '*/build.zig' | sed 's|/build.zig$||' | awk 'BEGIN{printf "["} {printf "%s\"%s\"", (NR>1?",":""), $0} END{printf "]"}')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

      - id: REL-DRAFT
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes

  rel-build:
    needs: rel-list
    runs-on: @@RELRUNNER@@
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.rel-list.outputs.apps) }}
    env:
      ZIG_VERS: "0.16.0"
    steps:
      - id: CODE-PULL
        uses: actions/checkout@v7

      - id: ZIGZ-INST
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERS}/zig-x86_64-linux-${ZIG_VERS}.tar.xz" -o zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - id: EXEZ-REL
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
        run: |
          set -e
          name="${APP//\//-}"
          mkdir -p dist
          for t in x86_64-linux x86_64-windows; do
            (cd "$APP" && rm -rf zig-out && zig build -Dtarget="$t" -Doptimize=ReleaseSafe)
            mkdir -p "dist/${name}-${t}"
            find "$APP/zig-out" -type f -path '*/bin/*' ! -name '*.pdb' -exec cp {} "dist/${name}-${t}/" \;
            [ -f LICENSE ] && cp LICENSE "dist/${name}-${t}/"
            case "$t" in
              *windows*) (cd dist && zip -qr "${name}-${t}.zip" "${name}-${t}") ;;
              *) tar -czf "dist/${name}-${t}.tar.gz" -C dist "${name}-${t}" ;;
            esac
            rm -rf "dist/${name}-${t}"
          done
          ls -la dist
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  rel-done:
    needs: rel-build
    runs-on: @@RELRUNNER@@
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - id: REL-OPEN
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
