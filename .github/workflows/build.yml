name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# one run per branch: a newer push cancels the older one (saves free minutes)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # kill switch: set the repo variable CI_KILL to 1 and every run stops here
    if: ${{ vars.CI_KILL != '1' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      ZIG_VERS: "0.16.0"
    steps:
      - id: CODE-PULL
        uses: actions/checkout@v4

      - id: ZIGZ-CASH
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.os }}-${{ hashFiles('**/build.zig.zon') }}

      - id: ZIGZ-INST
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERS}/zig-x86_64-linux-${ZIG_VERS}.tar.xz" -o zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - id: EXEZ-BUIL
        run: |
          set -e
          found=0
          for f in $(git ls-files '*build.zig'); do
            found=1
            (cd "$(dirname "$f")" && zig build && zig build test)
          done
          echo "build files: $found"

      - id: PING-SEND
        if: ${{ always() }}
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
          JOBZ_STAT: ${{ job.status }}
        run: |
          if [ -z "$HEALTHCHECKS_URL" ]; then echo "no ping url set"; exit 0; fi
          if [ "$JOBZ_STAT" = "success" ]; then curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL" > /dev/null; else curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL/fail" > /dev/null; fi
  # a tag like v0.1.0 builds the release files and publishes them as a GitHub Release
  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.CI_KILL != '1' }}
    runs-on: ubuntu-slim
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ZIG_VERS: "0.16.0"
    steps:
      - id: CODE-PULL
        uses: actions/checkout@v4

      - id: ZIGZ-INST
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERS}/zig-x86_64-linux-${ZIG_VERS}.tar.xz" -o zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - id: EXEZ-REL
        run: |
          set -e
          mkdir -p dist
          for f in $(git ls-files '*build.zig'); do
            d=$(dirname "$f"); app="${d//\//-}"
            for t in x86_64-linux x86_64-windows; do
              (cd "$d" && rm -rf zig-out && zig build -Dtarget="$t" -Doptimize=ReleaseSafe)
              mkdir -p "dist/${app}-${t}"
              find "$d/zig-out" -type f -path '*/bin/*' ! -name '*.pdb' -exec cp {} "dist/${app}-${t}/" \;
              case "$t" in
                *windows*) (cd dist && zip -qr "${app}-${t}.zip" "${app}-${t}") ;;
                *) tar -czf "dist/${app}-${t}.tar.gz" -C dist "${app}-${t}" ;;
              esac
              rm -rf "dist/${app}-${t}"
            done
          done
          ls -la dist

      - id: REL-MAKE
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
