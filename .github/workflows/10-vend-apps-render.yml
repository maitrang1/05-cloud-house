# made by the github app from 20-build.yml: one file per app, edits are overwritten
name: 10-vend-apps-render

on:
  push:
    branches: [main]
    paths:
      - '10-vend-apps/render/**'
      - '.github/workflows/10-vend-apps-render.yml'
    tags: ['10-vend-apps-render-v*']
  workflow_dispatch:

permissions:
  contents: read

# one run per ref: a newer push cancels the older one (saves free minutes)
concurrency:
  group: 10-vend-apps-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # a push that touches this app (or this file) runs this app's tests, nothing else
  test:
    # kill switch: set the repo variable CI_KILL to 1 and every run stops here
    if: ${{ !startsWith(github.ref, 'refs/tags/') && vars.CI_KILL != '1' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      ZIG_VERS: "0.16.0"
    steps:
      - id: CODE-PULL
        uses: actions/checkout@v7

      - id: ZIGZ-CASH
        uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.os }}-${{ hashFiles('**/build.zig.zon') }}

      - id: ZIGZ-INST
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERS}/zig-x86_64-linux-${ZIG_VERS}.tar.xz" -o zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - id: EXEZ-TEST
        working-directory: 10-vend-apps/render
        run: zig build test
  # a tag like 10-vend-apps-render-v0.1.0 builds this app only and publishes its own release
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/10-vend-apps-render-v') && vars.CI_KILL != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ZIG_VERS: "0.16.0"
    steps:
      - id: CODE-PULL
        uses: actions/checkout@v7

      - id: ZIGZ-INST
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERS}/zig-x86_64-linux-${ZIG_VERS}.tar.xz" -o zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - id: EXEZ-REL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          name="10-vend-apps-render"
          mkdir -p dist
          for t in x86_64-linux x86_64-windows; do
            (cd "10-vend-apps/render" && rm -rf zig-out && zig build -Dtarget="$t" -Doptimize=ReleaseSafe)
            mkdir -p "dist/${name}-${t}"
            find "10-vend-apps/render/zig-out" -type f -path '*/bin/*' ! -name '*.pdb' -exec cp {} "dist/${name}-${t}/" \;
            [ -f LICENSE ] && cp LICENSE "dist/${name}-${t}/"
            case "$t" in
              *windows*) (cd dist && zip -qr "${name}-${t}.zip" "${name}-${t}") ;;
              *) tar -czf "dist/${name}-${t}.tar.gz" -C dist "${name}-${t}" ;;
            esac
            rm -rf "dist/${name}-${t}"
          done
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
