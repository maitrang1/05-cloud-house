# made by the github app from 20-build.yml: one file per app, edits are overwritten
name: @@APP@@

on:
  push:
    branches: [main]
    paths:
      - '@@APPDIR@@/**'
      - '@@FLOWPATH@@'
    tags: ['@@APP@@-v*']
  workflow_dispatch:

permissions:
  contents: read

# one run per ref: a newer push cancels the older one (saves free minutes)
concurrency:
  group: @@APP@@-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # a push that touches this app (or this file) runs this app's tests, nothing else
  test:
    # kill switch: set the repo variable @@KILL@@ to 1 and every run stops here
    if: ${{ !startsWith(github.ref, 'refs/tags/') && vars.@@KILL@@ != '1' }}
    runs-on: @@RUNNER@@
    timeout-minutes: @@TIMEOUT@@
    env:
      ZIG_VERS: "@@ZIGVERS@@"
    steps:
      - id: CODE-PULL
        uses: actions/checkout@v7
@@CACHE@@
      - id: ZIGZ-INST
        run: |
          curl -fsSL "@@ZIGBASE@@/${ZIG_VERS}/zig-x86_64-linux-${ZIG_VERS}.tar.xz" -o zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - id: EXEZ-TEST
        working-directory: @@APPDIR@@
        run: zig build test
@@RELEASE_BEGIN@@
  # a tag like @@APP@@-v0.1.0 builds this app only and publishes its own release
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/@@APP@@-v') && vars.@@KILL@@ != '1' }}
    runs-on: @@RELRUNNER@@
    timeout-minutes: @@RELTIMEOUT@@
    permissions:
      contents: write
    env:
      ZIG_VERS: "@@ZIGVERS@@"
    steps:
      - id: CODE-PULL
        uses: actions/checkout@v7

      - id: ZIGZ-INST
        run: |
          curl -fsSL "@@ZIGBASE@@/${ZIG_VERS}/zig-x86_64-linux-${ZIG_VERS}.tar.xz" -o zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - id: EXEZ-REL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          name="@@APP@@"
          mkdir -p dist
          for t in @@RELTARGETS@@; do
            (cd "@@APPDIR@@" && rm -rf zig-out && zig build -Dtarget="$t" -Doptimize=ReleaseSafe)
            mkdir -p "dist/${name}-${t}"
            find "@@APPDIR@@/zig-out" -type f -path '*/bin/*' ! -name '*.pdb' -exec cp {} "dist/${name}-${t}/" \;
            [ -f LICENSE ] && cp LICENSE "dist/${name}-${t}/"
            case "$t" in
              *windows*) (cd dist && zip -qr "${name}-${t}.zip" "${name}-${t}") ;;
              *) tar -czf "dist/${name}-${t}.tar.gz" -C dist "${name}-${t}" ;;
            esac
            rm -rf "dist/${name}-${t}"
          done
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
@@RELEASE_END@@
